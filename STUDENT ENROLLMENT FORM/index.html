<!DOCTYPE html>
<html>
    <head>
        <title>Student Enrollment Form</title>

        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: skyblue;
                margin: 0;
                padding: 30px;
            }
            h1 {
                text-align: center;
                color: darkgray;
            }
            form{
                width:500px;
                margin:auto;
                background-color: white;
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 0 10px gray;
            }

            button{
                padding: 10px 20x;
                margin-top: 10x;
                cursor: pointer;
                border: none;
            }

        </style>
    </head>

    <body>
        <hi>Student Course Enrollment Form</hi>
        <form>

            <!--Name-->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <br><br>

            <!--Email-->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <!--Course-->
            <label for="Course">Course:</label>
            <select id="course" name="course" required>
                <option value="">--Select a Course--</option>
                <option value="Business">Business Administration</option>
                <option value="ICT">Information Technology</option>
                <option value="HRM">Human Resource Management</option>
            </select>

            <br><br>

            <!--Gender-->
            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <br><br>
            <!--Skills-->
            <label>Skills:</label>

            <input type="checkbox" id="html" name="skills" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skils" value="css">
            <label for="css">CSS</label>

            <input type="checkbox" id="communication" name="skills" value="communication">
            <label for="communication">Communiction</label>

            <input type="checkbox" id="Cloud Computing" name="skills" value="Cloud Computing">
            <label type="Cloud Computing">Cloud Computing</label>

            <br><br>

            <!--CV Upload-->
            <label for="CV">Upload CV:</label>
            <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>

            <br><br>

            <!--Date of Enrollment-->
            <label for="Enrollment-date">Date of Enrollment:</label>
            <input type="date" id="enrollment-date" name="enrollment- date" required>

            <br><br>

            <!--Buttons-->
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>

    </body>
</html>
